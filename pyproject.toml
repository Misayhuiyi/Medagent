[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "medagent"
version = "0.1.0"
description = "可复用的多 Agent 协作平台框架"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fpdf2>=2.8",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langgraph>=0.2",
    "mcp>=1.27.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "textual>=8.2.7",
    "uvicorn>=0.30",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["Code*"]

[tool.pytest.ini_options]
pythonpath = ["Code"]
asyncio_mode = "auto"
